name: Build iOS

# Builds and validates iOS app on every push to main, PR, or manual trigger.
# Requires: Xcode 14.0+, macOS 12.0+
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.claude/**'
      - 'docs/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build iOS App
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # JDK 21 required for Robolectric tests and Kotlin compilation
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Gradle setup
      - uses: gradle/actions/setup-gradle@v4

      # Step 1: Build Shared.framework for iOS
      - name: Build Shared.framework
        run: |
          ./gradlew :shared:linkReleaseFrameworkIosFat -x test --stacktrace
          echo "✅ Shared.framework built successfully"

      # Step 2: Create/validate Xcode project FIRST (needed before pod install)
      - name: Create Xcode project
        run: |
          cd iosApp

          # Check if .xcodeproj exists
          if [ ! -d "iosApp.xcodeproj" ]; then
            echo "📝 Creating Xcode project using generator script..."
            bash ./create-xcode-project.sh
            echo "✅ Xcode project created"
          else
            echo "✅ Xcode project already exists"
            ls -la iosApp.xcodeproj/
          fi

      # Step 3: Skip CocoaPods install - no pods configured
      # (Shared.framework is linked directly by Xcode project, not via CocoaPods)

      # Step 4: Build iOS app for simulator
      - name: Build iOS App (Simulator)
        run: |
          set -o pipefail
          cd iosApp
          xcodebuild -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            -verbose 2>&1 | tee build.log
          echo "✅ iOS app built successfully"

      # Step 5: Upload build artifacts
      - name: Upload iOS build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-artifacts
          path: |
            iosApp/build/
            shared/build/XCFrameworks/
          if-no-files-found: warn

      # Step 6: Build summary
      - name: Build Summary
        if: always()
        run: |
          echo "## iOS Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Shared.framework**: Built for iOS targets" >> $GITHUB_STEP_SUMMARY
          echo "✅ **CocoaPods**: Dependencies installed" >> $GITHUB_STEP_SUMMARY
          echo "✅ **iOS App**: Build validated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Pull latest changes locally (on Mac)" >> $GITHUB_STEP_SUMMARY
          echo "2. Run: \`cd iosApp && ./setup.sh\`" >> $GITHUB_STEP_SUMMARY
          echo "3. Open: \`iosApp.xcworkspace\` in Xcode" >> $GITHUB_STEP_SUMMARY
          echo "4. Build & Run on simulator/device" >> $GITHUB_STEP_SUMMARY
