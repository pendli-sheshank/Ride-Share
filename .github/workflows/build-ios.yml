name: Build iOS

# Builds and validates iOS app on every push to main, PR, or manual trigger.
# Requires: Xcode 14.0+, macOS 12.0+
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.claude/**'
      - 'docs/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build iOS App
    # Kept in step with ios-release.yml so the PR gate compiles against the same SDK the
    # release build uses. macos-14 pins Xcode 15.4 / iOS 17.5, below the App Store floor.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # JDK 21 required for Robolectric tests and Kotlin compilation
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Gradle setup
      - uses: gradle/actions/setup-gradle@v4

      # Step 1: Build Shared.framework for iOS
      - name: Build Shared.framework
        # iOS reads its Firebase settings from the generated FirebaseBuildConfig baked into the
        # XCFramework, so they have to be present at Gradle time. On a PR from a fork these are
        # empty, which is fine: the framework builds and reports itself unconfigured.
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          # Optional; only needed if Firestore was created with a non-"(default)" Database ID.
          FIRESTORE_DATABASE_ID: ${{ secrets.FIRESTORE_DATABASE_ID }}
          # Optional Google Places (New) key for address autocomplete. Empty -> free Photon/OSM search.
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          ./gradlew :shared:assembleSharedReleaseXCFramework --stacktrace
          # linkReleaseFrameworkIosFat produces a device+simulator fat binary that App
          # Store upload rejects, and never writes to build/XCFrameworks at all.
          ls -R shared/build/XCFrameworks

      # Catches a dangling object reference in the generated pbxproj. Xcode reports that only
      # as "the project is damaged", with no file, line or ID — and only on a macOS runner,
      # minutes into a release build. This runs in milliseconds, on any platform.
      - name: Verify the Xcode project graph is intact
        run: python3 .github/scripts/verify-xcodeproj.py iosApp/iosApp.xcodeproj/project.pbxproj iosApp/iosApp

      # actool only warns when an .appiconset declares images it does not have, so a catalog
      # with zero PNGs builds, signs and exports clean and is rejected at upload instead.
      # That cost build 12 and a burned build number. This check is milliseconds.
      - name: Verify the app icon set is complete
        run: python3 .github/scripts/verify-app-icons.py iosApp/iosApp/Assets.xcassets/AppIcon.appiconset

      # Same class as the icon check: a bundle problem xcodebuild is perfectly happy with, that
      # only surfaces at `altool --validate-app` -- after a build number has been consumed and
      # cannot be reused. The app declared `UIRequiredDeviceCapabilities = armv7` on an arm64-only
      # iOS 16 binary, which is an "Invalid Bundle" rejection, and had no
      # ITSAppUsesNonExemptEncryption, so every upload stalled on the manual export-compliance
      # question. Milliseconds to check.
      - name: Verify Info.plist passes App Store preflight
        run: python3 .github/scripts/verify-info-plist.py iosApp/iosApp/Info.plist

      # The generator is deterministic, so a regenerated project must be byte-identical to the
      # committed one. If it is not, the checked-in project was hand-edited and the next
      # regeneration would silently revert that edit.
      - name: Verify the committed project matches the generator
        run: |
          cd iosApp
          cp iosApp.xcodeproj/project.pbxproj /tmp/committed.pbxproj
          python3 generate-project.py > /dev/null
          if ! diff -u /tmp/committed.pbxproj iosApp.xcodeproj/project.pbxproj; then
            echo "::error::project.pbxproj differs from generate-project.py output."
            echo "Re-run iosApp/generate-project.py and commit the result, or fix the generator."
            exit 1
          fi
          echo "Committed project matches the generator."

      # Step 2: Verify iOS project structure
      - name: Verify iOS project structure
        run: |
          cd iosApp
          echo "🔍 Verifying iOS project structure..."

          # Check essential files
          check_file() {
            if [ -f "$1" ]; then
              echo "  ✅ $1"
            else
              echo "  ❌ $1 MISSING"
              exit 1
            fi
          }

          check_dir() {
            if [ -d "$1" ]; then
              echo "  ✅ $1/"
            else
              echo "  ❌ $1/ MISSING"
              exit 1
            fi
          }

          echo "Swift source files:"
          check_file "iosApp/iOSApp.swift"
          check_file "iosApp/ContentView.swift"

          echo "Configuration files:"
          check_file "iosApp/Info.plist"
          check_file "Podfile"

          echo "Resources:"
          check_file "iosApp/LaunchScreen.storyboard"
          check_dir "iosApp/Assets.xcassets"
          check_dir "iosApp/Assets.xcassets/AppIcon.appiconset"
          check_dir "iosApp/Assets.xcassets/AccentColor.colorset"

          echo "Xcode project:"
          check_file "iosApp.xcodeproj/project.pbxproj"
          check_dir "iosApp.xcodeproj/project.xcworkspace"

          echo "✅ All required project files present"

      # Step 3: Generate/validate Xcode project
      - name: Generate Xcode project
        run: |
          cd iosApp

          if [ ! -f "iosApp.xcodeproj/project.pbxproj" ]; then
            echo "📝 Generating Xcode project..."
            python3 generate-project.py
            echo "✅ Xcode project generated"
          else
            echo "✅ Xcode project already exists"
          fi

          # Verify pbxproj is valid
          if grep -q "archiveVersion = 1" iosApp.xcodeproj/project.pbxproj; then
            echo "✅ Xcode project structure is valid"
          else
            echo "❌ Xcode project structure invalid"
            exit 1
          fi

      # Step 4: Compile the app
      #
      # This used to be a per-file `swiftc -parse ... || true` loop, which could never fail and
      # never resolved `import Shared` — so no PR job compiled the Swift at all. The only real
      # compile was the `xcodebuild archive` in ios-release.yml, which runs on push to main,
      # i.e. after merge, in the same workflow that uploads to TestFlight. A type error therefore
      # could not be caught until it had already broken the release pipeline, and a build number
      # can never be reused.
      #
      # Debug rather than Release: -Onone typechecks substantially faster than Release's
      # wholemodule -O, and a PR gate wants type errors, not an optimised binary. ios-release.yml
      # still builds Release on main. This needs Debug's FRAMEWORK_SEARCH_PATHS to include the
      # release XCFramework directory — the only one either workflow builds — which is why
      # generate-project.py lists both.
      #
      # A simulator destination needs no signing and no secrets, so this still works on fork PRs
      # where the Firebase values are empty — the framework just reports itself unconfigured.
      # 'generic/platform=iOS Simulator' avoids a simctl device lookup that would break whenever
      # the runner image changes which simulators are preinstalled.
      - name: Compile the app for the simulator
        run: |
          xcodebuild build \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      # This step has no `if:`, so it runs only when every step above it succeeded. That is the
      # whole reason it can state these as facts.
      - name: iOS Build Summary
        run: |
          echo "iOS project validation complete:"
          echo "  Shared.xcframework built"
          echo "  iOS project structure verified"
          echo "  Xcode project generated and matches the committed pbxproj"
          echo "  Info.plist passed App Store preflight"
          echo "  Swift compiled for the iOS Simulator"

      # Step 5: Upload build artifacts
      - name: Upload iOS build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-artifacts
          path: |
            iosApp/build/
            shared/build/XCFrameworks/
          if-no-files-found: warn

      # Reports what actually happened.
      #
      # This step used to be `if: always()` writing an unconditional wall of green checkmarks, so a
      # red run rendered a summary tab claiming Swift had compiled and the project was valid. A
      # summary that cannot say "failed" is worse than no summary: it is the same shape as the
      # per-file `swiftc -parse || true` loop that let a Swift type error reach main.
      - name: Build Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## iOS build and validation"
            echo ""
            if [ "$JOB_STATUS" = "success" ]; then
              echo "**Result: passed.** The Swift sources compiled for the iOS Simulator against a"
              echo "freshly built Shared.xcframework, and the committed \`project.pbxproj\` matches"
              echo "what \`generate-project.py\` produces."
            else
              echo "**Result: $JOB_STATUS.** See the failing step above — do not treat this build as"
              echo "validated. Swift is compiled by no other job before merge."
            fi
            echo ""
            echo "Simulator builds are unsigned and cost nothing in Apple account state; the"
            echo "TestFlight pipeline lives in \`ios-release.yml\`."
          } >> "$GITHUB_STEP_SUMMARY"
