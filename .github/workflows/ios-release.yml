name: iOS App Release Pipeline

# Runs on every push to main (mirroring release-android.yml) so TestFlight always reflects
# main, plus manual dispatch for a deliberate release_type choice. Uploading a build to App
# Store Connect is not reversible — a build number can never be reused, even if the upload is
# later deleted — but that is true of every run regardless of trigger, and the alternative
# (TestFlight silently going stale behind main) is the worse failure mode. An automatic push
# run has no human to pick release_type, so it always resolves to 'beta' — see RELEASE_TYPE
# below; 'production' stays a deliberate workflow_dispatch choice.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.claude/**'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      release_type:
        description: 'beta = upload to TestFlight; production = upload, then submit for review in App Store Connect'
        required: true
        default: 'beta'
        type: choice
        options:
          - beta
          - production

concurrency:
  # Never cancel a run mid-upload; queue instead. Same group shape as release-android.yml.
  group: ios-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Build, sign and upload iOS build
    runs-on: macos-15
    # github.event.inputs.release_type only exists on workflow_dispatch; a push event leaves
    # it empty, so this falls back to 'beta' — an automatic run must never resolve to
    # 'production' by accident of an unset input.
    env:
      RELEASE_TYPE: ${{ github.event.inputs.release_type || 'beta' }}
    steps:
      - uses: actions/checkout@v4

      # --- Toolchain ---------------------------------------------------------------------
      # App Store Connect rejected build 12 with:
      #   "This app was built with the iOS 17.5 SDK. All iOS and iPadOS apps must be built
      #    with the iOS 26 SDK or later, included in Xcode 26 or later."
      # macos-14 ships Xcode 15.4. Apple raises this floor roughly once a year, so select the
      # newest Xcode present on the image rather than pinning a version that expires, and
      # check the SDK here — in seconds — instead of after a full build, archive and upload.
      - name: Select the newest Xcode and verify the iOS SDK
        env:
          MIN_IOS_SDK_MAJOR: '26'
        run: |
          set -uo pipefail

          # Every command substitution below ends in `|| var=`. `set -e` is on (bash -e {0})
          # and `pipefail` is set, so an unreadable Xcode or a grep that matches nothing
          # would kill the step before the explicit error checks could report anything —
          # the same trap that made the altool failure invisible for two runs.
          echo "::group::Xcode versions on this runner"
          for app in /Applications/Xcode*.app; do
            v=$("$app/Contents/Developer/usr/bin/xcodebuild" -version 2>/dev/null | head -1) || v=""
            echo "$app — ${v:-unreadable}"
          done
          echo "::endgroup::"

          best=$(for app in /Applications/Xcode*.app; do
            v=$("$app/Contents/Developer/usr/bin/xcodebuild" -version 2>/dev/null | head -1 | awk '{print $2}') || v=""
            if [ -n "$v" ]; then echo "$v $app"; fi
          done | sort -V | tail -1) || best=""

          if [ -z "$best" ]; then
            echo "::error::No usable Xcode found under /Applications."
            exit 1
          fi

          xcode_ver=${best%% *}
          xcode_app=${best#* }
          sudo xcode-select -s "$xcode_app/Contents/Developer"
          echo "Selected Xcode $xcode_ver at $xcode_app"

          sdk=$(xcodebuild -showsdks 2>/dev/null | grep -o 'iphoneos[0-9.]*' | sed 's/iphoneos//' | sort -V | tail -1) || sdk=""
          echo "Newest iOS SDK: ${sdk:-none}"

          if [ -z "$sdk" ]; then
            echo "::error::Xcode $xcode_ver exposes no iphoneos SDK."
            exit 1
          fi

          if [ "${sdk%%.*}" -lt "$MIN_IOS_SDK_MAJOR" ]; then
            echo "::error::iOS SDK $sdk is below the App Store minimum of ${MIN_IOS_SDK_MAJOR}.0. \
          The newest Xcode on runner image '${{ runner.os }}/macos-15' is $xcode_ver. \
          Move the job to a newer runner image, or install Xcode ${MIN_IOS_SDK_MAJOR} explicitly."
            exit 1
          fi

          echo "DEVELOPER_DIR=$xcode_app/Contents/Developer" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # --- Fail fast on missing secrets -------------------------------------------------
      # Without this, a missing secret surfaces as an opaque xcodebuild or altool error
      # several minutes into the run. Named up front, it takes seconds to diagnose.
      - name: Check required secrets are configured
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CERT_P12: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APPSTORE_CONNECT_PRIVATE_KEY }}
        run: |
          missing=""
          for name in TEAM_ID CERT_P12 CERT_PASSWORD PROFILE ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required repository secrets:$missing"
            echo "See .claude/ios-release-pipeline.md for how to generate each one."
            exit 1
          fi
          echo "All required secrets are present."

      # Same reasoning as the secret preflight: an incomplete icon set is invisible until
      # `altool --validate-app`, which is eight minutes and one consumed build number too
      # late. Build 12 died on exactly this.
      - name: Verify the app icon set is complete
        run: python3 .github/scripts/verify-app-icons.py iosApp/iosApp/Assets.xcassets/AppIcon.appiconset

      # --- Shared Kotlin framework ------------------------------------------------------
      # assembleSharedReleaseXCFramework, NOT linkReleaseFrameworkIosFat: the latter lipos
      # device (iosArm64) and simulator (iosX64) slices into one binary, and App Store upload
      # rejects an archive containing simulator slices with ITMS-90240.
      - name: Build Shared.xcframework
        # The shipped iOS build reads its Firebase settings from the generated
        # FirebaseBuildConfig inside this framework. Miss these and TestFlight gets a build
        # that cannot reach the backend at all.
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          # Optional; only needed if Firestore was created with a non-"(default)" Database ID.
          FIRESTORE_DATABASE_ID: ${{ secrets.FIRESTORE_DATABASE_ID }}
          # Optional Google Places (New) key for address autocomplete. Empty -> free Photon/OSM search.
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: ./gradlew :shared:assembleSharedReleaseXCFramework --stacktrace

      # The Xcode project links ../shared/build/XCFrameworks/release/Shared.xcframework by
      # path. If Gradle ever changes that output location the archive fails later with a
      # confusing "no such module 'Shared'", so assert the path here instead.
      - name: Verify the framework landed where Xcode expects it
        run: |
          framework="shared/build/XCFrameworks/release/Shared.xcframework"
          if [ ! -d "$framework" ]; then
            echo "::error::Expected $framework to exist after the Gradle build."
            echo "Contents of shared/build/XCFrameworks:"
            ls -R shared/build/XCFrameworks || echo "(directory does not exist)"
            exit 1
          fi
          echo "Found $framework"
          ls "$framework"

      # --- Code signing -----------------------------------------------------------------
      # Signing material goes into a throwaway keychain that is deleted in the cleanup step,
      # so nothing persists on the runner even though runners are ephemeral anyway.
      - name: Install signing certificate and provisioning profile
        env:
          CERT_P12: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          set -euo pipefail
          cert_path="$RUNNER_TEMP/dist.p12"
          profile_path="$RUNNER_TEMP/profile.mobileprovision"
          keychain_path="$RUNNER_TEMP/signing.keychain-db"

          # Redirection rather than `base64 -o`: the -o flag is BSD-only and this recipe gets
          # copied to Linux runners often enough that it is not worth the trap.
          printf '%s' "$CERT_P12" | base64 --decode > "$cert_path"
          printf '%s' "$PROFILE" | base64 --decode > "$profile_path"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"

          security import "$cert_path" -P "$CERT_PASSWORD" -A \
            -t cert -f pkcs12 -k "$keychain_path"
          # Lets codesign use the key without an interactive prompt.
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$keychain_path" > /dev/null
          security list-keychains -d user -s "$keychain_path"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          uuid=$(security cms -D -i "$profile_path" | plutil -extract UUID raw -)
          cp "$profile_path" "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"
          echo "PROVISIONING_PROFILE_UUID=$uuid" >> "$GITHUB_ENV"

          echo "Installed signing identities:"
          security find-identity -v -p codesigning "$keychain_path"

      # --- Version / build number -------------------------------------------------------
      # App Store Connect rejects a build whose CFBundleVersion it has already seen for this
      # CFBundleShortVersionString. run_number is monotonic per workflow, so it never repeats.
      - name: Set build number
        run: |
          set -euo pipefail
          plist="iosApp/iosApp/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" "$plist"
          echo "Marketing version: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")"
          echo "Build number:      $(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")"

      # --- Archive ----------------------------------------------------------------------
      # No CocoaPods step: the Podfile declares no pods for the iosApp target, so there is
      # nothing to install, and running it would force building a .xcworkspace instead.
      - name: Create Xcode archive
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/iosApp.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROVISIONING_PROFILE_UUID" \
            CODE_SIGN_IDENTITY="Apple Distribution"

      - name: Export signed IPA
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/iosApp.xcarchive"

          # Read the bundle id out of the archive rather than hardcoding it, so this cannot
          # drift from PRODUCT_BUNDLE_IDENTIFIER in the project.
          bundle_id=$(/usr/libexec/PlistBuddy -c \
            "Print :ApplicationProperties:CFBundleIdentifier" "$archive/Info.plist")
          echo "Archive bundle id: $bundle_id"

          # Generated here rather than committed so the team ID stays out of the repository.
          #
          # `provisioningProfiles` is REQUIRED when signingStyle is manual. Omitting it does not
          # produce a clean error — Xcode 15's exportArchive segfaults (exit 139) while trying
          # to resolve a profile it was never given. That is what failed the previous run.
          cat > "$RUNNER_TEMP/exportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>destination</key>
            <string>export</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$bundle_id</key>
              <string>$PROVISIONING_PROFILE_UUID</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST

          echo "--- exportOptions.plist ---"
          cat "$RUNNER_TEMP/exportOptions.plist"

          # Do not let a non-zero exit abort the step: we want the fallback below to run.
          set +e
          xcodebuild -exportArchive \
            -archivePath "$archive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/exportOptions.plist" \
            -allowProvisioningUpdates
          export_status=$?
          set -e
          echo "xcodebuild -exportArchive exited $export_status"

          # Fallback. An .ipa is just a zip with the signed .app inside Payload/, and the app in
          # the archive is already distribution-signed by the archive step (it embedded the
          # profile and signed with "Apple Distribution"). So if exportArchive crashes again we
          # can still produce a valid, uploadable IPA rather than losing the whole run.
          if ! ls "$RUNNER_TEMP/export"/*.ipa >/dev/null 2>&1; then
            echo "::warning::exportArchive produced no IPA (exit $export_status); packaging from the archive instead."
            apps=("$archive/Products/Applications/"*.app)
            app_path="${apps[0]}"
            echo "Packaging $app_path"
            rm -rf "$RUNNER_TEMP/payload-build"
            mkdir -p "$RUNNER_TEMP/payload-build/Payload" "$RUNNER_TEMP/export"
            cp -R "$app_path" "$RUNNER_TEMP/payload-build/Payload/"
            ( cd "$RUNNER_TEMP/payload-build" && zip -qry "$RUNNER_TEMP/export/iosApp.ipa" Payload )
            # Confirm what we packaged is actually signed; an unsigned IPA is rejected on
            # upload with a far less obvious message.
            codesign -dv --verbose=4 "$app_path" 2>&1 | sed -n '1,6p'
          fi

          if ! ls "$RUNNER_TEMP/export"/*.ipa >/dev/null 2>&1; then
            echo "::error::No IPA produced by either exportArchive or the archive fallback."
            exit 1
          fi
          ls -lh "$RUNNER_TEMP/export"

      # --- Upload to App Store Connect --------------------------------------------------
      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APPSTORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -uo pipefail

          # altool discovers the key by filename in this directory; the name is not arbitrary.
          key_dir="$HOME/.appstoreconnect/private_keys"
          key_file="$key_dir/AuthKey_${ASC_KEY_ID}.p8"
          mkdir -p "$key_dir"
          printf '%s' "$ASC_PRIVATE_KEY" > "$key_file"

          # --- Diagnostics -------------------------------------------------------------
          # Two previous runs died here in under a second with no output at all. Everything
          # below is printed so the *next* failure is readable from the log rather than
          # inferred. None of it prints key material.
          echo "::group::Upload preflight"
          echo "xcode-select -p : $(xcode-select -p 2>&1)"
          echo "xcrun --find altool : $(xcrun --find altool 2>&1 || echo NOT-FOUND)"
          echo "key file present : $([ -f "$key_file" ] && echo yes || echo no)"
          echo "key file bytes   : $(wc -c < "$key_file" | tr -d ' ')"
          # A .p8 must be PEM. If the secret was pasted with escaped \n instead of real
          # newlines this is the only visible symptom, and altool just fails.
          if head -c 27 "$key_file" | grep -q -- "-----BEGIN PRIVATE KEY-----"; then
            echo "key file header  : OK (PEM)"
          else
            echo "key file header  : BAD — does not start with -----BEGIN PRIVATE KEY-----"
            echo "::warning::APPSTORE_CONNECT_PRIVATE_KEY does not look like a PEM .p8. Paste the whole file including the BEGIN/END lines and real newlines."
          fi
          echo "key id length    : ${#ASC_KEY_ID}"
          echo "issuer id length : ${#ASC_ISSUER_ID}"
          echo "::endgroup::"

          ipas=("$RUNNER_TEMP/export"/*.ipa)
          ipa="${ipas[0]}"
          if [ ! -f "$ipa" ]; then
            echo "::error::No .ipa found in $RUNNER_TEMP/export."
            ls -la "$RUNNER_TEMP/export" || true
            exit 1
          fi
          echo "Uploading $ipa ($(du -h "$ipa" | cut -f1))"

          log="$RUNNER_TEMP/altool.log"

          # Validate first. A build number can never be reused once App Store Connect has seen
          # it, so it is worth one extra call to reject a bad binary without burning the number.
          # `|| validate_status=$?` is load-bearing, not style. GitHub runs this step as
          # `bash -e {0}`, so `set -e` is on regardless of the `set` line above — a bare
          # `cmd` followed by `status=$?` never reaches the assignment, and every diagnostic
          # below it is dead code. One run was lost to exactly that. Keep the `||`.
          validate_status=0
          xcrun altool --validate-app \
            --file "$ipa" \
            --type ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID" > "$log" 2>&1 || validate_status=$?
          echo "--- altool --validate-app (exit $validate_status) ---"
          cat "$log"

          if [ $validate_status -ne 0 ]; then
            {
              echo "### Upload failed at \`altool --validate-app\` (exit $validate_status)"
              echo ""
              echo '```'
              tail -n 40 "$log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            rm -f "$key_file"
            exit "$validate_status"
          fi

          upload_status=0
          xcrun altool --upload-app \
            --file "$ipa" \
            --type ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID" > "$log" 2>&1 || upload_status=$?
          echo "--- altool --upload-app (exit $upload_status) ---"
          cat "$log"

          if [ $upload_status -ne 0 ]; then
            {
              echo "### Upload failed at \`altool --upload-app\` (exit $upload_status)"
              echo ""
              echo '```'
              tail -n 40 "$log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            rm -f "$key_file"
            exit "$upload_status"
          fi

          rm -f "$key_file"

      - name: Upload IPA as a workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: warn
          # This is a distribution-signed IPA and anyone with repo read access can download a
          # workflow artifact. The build has already gone to TestFlight, so this copy is only a
          # short debugging convenience — keep the exposure window to a day rather than 30.
          retention-days: 1

      # Runners are ephemeral, but an unlocked keychain left behind would be visible to any
      # later step in this same job, so remove it explicitly.
      - name: Clean up keychain and signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/dist.p12" "$RUNNER_TEMP/profile.mobileprovision"
          rm -rf "$HOME/.appstoreconnect/private_keys"

      - name: Summary
        if: always()
        run: |
          {
            echo "## iOS release — ${{ env.RELEASE_TYPE }} (${{ github.event_name }})"
            echo ""
            echo "- Build number: \`${{ github.run_number }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo ""
            if [ "${{ job.status }}" = "success" ]; then
              echo "Build uploaded to App Store Connect. Processing usually takes 10–30 minutes."
              echo ""
              if [ "${{ env.RELEASE_TYPE }}" = "beta" ]; then
                echo "Next: assign the build to a TestFlight group in App Store Connect."
              else
                echo "Next: attach the build to the App Store version and submit for review."
              fi
            else
              echo "Run failed — see the failing step above."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
