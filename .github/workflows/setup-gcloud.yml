name: One-Time Setup — Google Cloud Project (Fixed)

# This workflow automates the creation of a Google Cloud project and service account
# for Play Store + Firebase. Run it once via workflow_dispatch, then use the outputs
# to populate GitHub Secrets. After that, delete this workflow or leave it disabled.
#
# Prerequisites:
#   1. Create a Google Cloud Organization (or use the default for your account)
#   2. Enable the Cloud Resource Manager API in an existing GCP project (any project)
#   3. Create a service account in that project with roles:
#      - Billing Account User (to enable the Play API on the new project)
#      - Project Creator
#   4. Create a key for that service account and set SETUP_GCP_KEY_JSON secret
#   5. Set SETUP_GCP_PROJECT_ID to the existing project ID
#   6. Set SETUP_BILLING_ACCOUNT_ID if you have a specific billing account (optional)

on:
  workflow_dispatch:
    inputs:
      app_project_id:
        description: 'New GCP project ID (will be created, e.g. splitcruiser-prod-2026)'
        required: true
        type: string
      app_name:
        description: 'App name for logs and resources (e.g. SplitCruiser)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  setup:
    name: Create GCP Project & Service Account
    runs-on: ubuntu-latest
    env:
      HAS_BILLING_ACCOUNT: ${{ secrets.SETUP_BILLING_ACCOUNT_ID != '' }}
    outputs:
      service_account_json: ${{ steps.create-key.outputs.key_json }}
      service_account_email: ${{ steps.create-sa.outputs.sa_email }}
      project_id: ${{ inputs.app_project_id }}
    steps:
      - name: Authenticate with GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.SETUP_GCP_KEY_JSON }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Create GCP Project
        id: create-project
        run: |
          PROJECT_ID="${{ inputs.app_project_id }}"
          echo "Creating project $PROJECT_ID..."
          # If you have an organization, add: --organization=YOUR_ORG_ID
          # To find org ID: gcloud organizations list
          # Then uncomment the next line and replace YOUR_ORG_ID
          # gcloud projects create "$PROJECT_ID" --name="${{ inputs.app_name }}" --organization=YOUR_ORG_ID
          gcloud projects create "$PROJECT_ID" --name="${{ inputs.app_name }}"
          echo "project_id=$PROJECT_ID" >> "$GITHUB_OUTPUT"

      - name: Link to Billing Account (if specified)
        if: env.HAS_BILLING_ACCOUNT == 'true'
        run: |
          gcloud billing projects link ${{ inputs.app_project_id }} \
            --billing-account=${{ secrets.SETUP_BILLING_ACCOUNT_ID }}

      - name: Enable Required APIs
        run: |
          gcloud services enable \
            --project=${{ inputs.app_project_id }} \
            androidpublisher.googleapis.com \
            firebaseproject.googleapis.com \
            firebaserules.googleapis.com \
            firestore.googleapis.com

      - name: Create Service Account
        id: create-sa
        run: |
          SA_NAME="play-store-ci"
          SA_EMAIL="${SA_NAME}@${{ inputs.app_project_id }}.iam.gserviceaccount.com"
          echo "Creating service account $SA_EMAIL..."
          gcloud iam service-accounts create "$SA_NAME" \
            --project=${{ inputs.app_project_id }} \
            --display-name="Play Store CI/CD"
          echo "sa_email=$SA_EMAIL" >> "$GITHUB_OUTPUT"

      - name: Grant Play API Role
        run: |
          gcloud projects add-iam-policy-binding ${{ inputs.app_project_id }} \
            --member="serviceAccount:${{ steps.create-sa.outputs.sa_email }}" \
            --role="roles/androidpublisher.admin"

      - name: Grant Firebase Admin Role
        run: |
          gcloud projects add-iam-policy-binding ${{ inputs.app_project_id }} \
            --member="serviceAccount:${{ steps.create-sa.outputs.sa_email }}" \
            --role="roles/firebase.admin"

      - name: Create Service Account Key
        id: create-key
        run: |
          SA_EMAIL="${{ steps.create-sa.outputs.sa_email }}"
          KEY_FILE=$(mktemp)
          gcloud iam service-accounts keys create "$KEY_FILE" \
            --iam-account="$SA_EMAIL" \
            --project=${{ inputs.app_project_id }}
          # Output as single-line JSON (remove all newlines for safe GitHub output)
          KEY_JSON=$(jq -c . < "$KEY_FILE")
          echo "key_json=$KEY_JSON" >> "$GITHUB_OUTPUT"
          # Also print for manual copy-paste
          echo "::notice::Save this service account JSON as PLAY_SERVICE_ACCOUNT_JSON secret:"
          cat "$KEY_FILE"

      - name: Summary
        run: |
          cat <<EOF
          ✓ GCP Project created: ${{ inputs.app_project_id }}
          ✓ Service Account: ${{ steps.create-sa.outputs.sa_email }}
          ✓ APIs enabled: Play Publisher, Firebase, Firestore

          NEXT STEPS:
          1. Copy the service account JSON above
          2. Add it to GitHub Secrets as PLAY_SERVICE_ACCOUNT_JSON
          3. Create the Play Console app listing manually (see guide below)
          4. Add other secrets (Firebase, Gemini, signing key)
          EOF
