name: Release Android

# Publishes to the Play Store "internal testing" track on every push to main.
# Runs independently of the iOS release workflow: neither can block the other.
#
# Setup runbook and secret inventory: .claude/skills/release-pipeline/SKILL.md
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.claude/**'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      publish:
        description: Upload the build to Play internal testing
        type: boolean
        default: false

concurrency:
  # Never cancel a run mid-upload; queue instead.
  group: release-android-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Build AAB & publish to internal testing
    runs-on: ubuntu-latest
    # The `secrets` context cannot be used in `if:` conditions — doing so makes the whole
    # workflow file fail validation, which GitHub reports as a run with zero jobs titled by
    # filename rather than workflow name. `jobs.<id>.env` does allow it, so the presence
    # checks are hoisted here and the steps gate on these flags instead.
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_PLAY_SERVICE_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
      HAS_GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}
    steps:
      - uses: actions/checkout@v4

      # JDK 21, not 17: Robolectric maps Android API 36 to a Java 21 requirement and throws
      # UnsupportedOperationException ("Android SDK 36 requires Java 21") on anything lower.
      # compileSdk/targetSdk are 36 and the Robolectric tests use @Config(sdk = [36]).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # Installs cmdline-tools and puts sdkmanager on PATH. The runner image ships an SDK
      # but not sdkmanager itself, so calling it directly fails with exit 127.
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      # GitHub Actions expressions have no arithmetic operators — `${{ 1000 + x }}` is a
      # syntax error that fails the whole workflow. Compute in the shell and export instead.
      - name: Compute version
        run: |
          echo "VERSION_CODE=$(( 1000 + GITHUB_RUN_NUMBER ))" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.0.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      # The Secrets Gradle Plugin turns these into :app BuildConfig fields. Nothing reads them
      # any more — the backend moved to :shared and reads the environment variables directly in
      # the "Build release bundle" step below. Kept because the plugin expects the file; remove
      # both together if the plugin is ever dropped.
      - name: Write .env
        run: |
          cat > .env <<EOF
          FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }}
          EOF

      - name: Write google-services.json
        if: env.HAS_GOOGLE_SERVICES == 'true'
        run: |
          cat > app/google-services.json <<'EOF'
          ${{ secrets.GOOGLE_SERVICES_JSON }}
          EOF

      # Written outside the workspace so it can never be swept into an artifact upload.
      - name: Decode upload keystore
        if: env.HAS_KEYSTORE == 'true'
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Build release bundle
        env:
          # Left empty when no keystore secret is set; the build then produces an
          # unsigned bundle instead of failing, so PR-time validation still works.
          KEYSTORE_PATH: ${{ env.HAS_KEYSTORE == 'true' && format('{0}/upload.jks', runner.temp) || '' }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          # The backend lives in :shared now and reads these at Gradle time to generate
          # FirebaseBuildConfig. Writing .env above only reaches :app's BuildConfig via the
          # secrets plugin, which nothing consumes any more, so these are what actually
          # configure the app. Same three secrets, no new ones.
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          # Empty until the Google sign-in provider is enabled; the button then hides itself
          # rather than failing at the tap.
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          # Optional; only needed if Firestore was created with a non-"(default)" Database ID.
          FIRESTORE_DATABASE_ID: ${{ secrets.FIRESTORE_DATABASE_ID }}
          # Optional Google Places (New) key for address autocomplete. Empty -> free Photon/OSM search.
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          # VERSION_CODE / VERSION_NAME come from the Compute version step above.
          # Currently published versionCode is 2; the 1000 offset guarantees the value only
          # ever increases. NOTE: github.run_number resets to 1 if this workflow file is
          # renamed — bump the offset if you ever rename it.
        run: ./gradlew :app:bundleRelease --stacktrace

      - name: Verify the AAB contains the app's own classes
        run: .github/scripts/verify-app-classes.sh app/build/outputs/bundle/release/app-release.aab base/dex/

      - name: Upload AAB artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn

      - name: Publish to Play internal testing
        id: play_publish
        # TEMPORARY: non-blocking. Google Play is rejecting the commit with "all keys should be
        # registered to meet the Android Developer Verification requirements" — a Play Console
        # account/key-registration gate, not a build problem (the AAB builds and signs fine and is
        # uploaded as a workflow artifact above). `continue-on-error` keeps a merge to main from
        # showing a red release while that registration is completed in the Play Console. REMOVE this
        # line once the signing key is registered, so a genuine publish failure fails the job again.
        continue-on-error: true
        if: env.HAS_PLAY_SERVICE_ACCOUNT == 'true' && env.HAS_KEYSTORE == 'true' && (github.event_name == 'push' || inputs.publish)
        # Pinned to a commit SHA, not the mutable v1.1.3 tag: this step is handed the Play
        # service-account JSON (the highest-value secret in the repo), so the action code it runs
        # must not be able to change under a re-pointed tag.
        uses: r0adkll/upload-google-play@935ef9c68bb393a8e6116b1575626a7f5be3a7fb # v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.splitcruiser.app
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
          releaseName: ${{ env.VERSION_NAME }} (${{ env.VERSION_CODE }})

      # Surfaces the outcome so a swallowed publish failure is still visible in the run, not silent.
      - name: Note Play publish outcome
        if: always() && steps.play_publish.outcome != ''
        run: |
          if [ "${{ steps.play_publish.outcome }}" = "success" ]; then
            echo "✅ Published to Play internal testing (${VERSION_NAME} / ${VERSION_CODE})." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "⚠️ **Play publish did not succeed** (build + signed AAB are fine and uploaded as an artifact)."
              echo "This step is temporarily non-blocking while the signing key is registered for"
              echo "Android Developer Verification in the Play Console. Remove \`continue-on-error\` from"
              echo "the publish step once that is done."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # always(), so the reason is still reported when an earlier step failed.
      - name: Explain skipped publish
        if: always() && (env.HAS_PLAY_SERVICE_ACCOUNT != 'true' || env.HAS_KEYSTORE != 'true')
        run: |
          echo "::warning::Did not publish. HAS_KEYSTORE=$HAS_KEYSTORE HAS_PLAY_SERVICE_ACCOUNT=$HAS_PLAY_SERVICE_ACCOUNT"
          echo "Both the upload keystore and the Play service account are required to publish."
          echo "See .claude/skills/release-pipeline/SKILL.md for the setup runbooks."
