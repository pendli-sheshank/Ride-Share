name: CI

# Validation for pull requests and feature branches. Builds and tests only —
# no secrets, no signing, no publishing. The release workflows handle that.
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Build & test Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # JDK 21, not 17: Robolectric maps Android API 36 to a Java 21 requirement and throws
      # UnsupportedOperationException ("Android SDK 36 requires Java 21") on anything lower.
      # compileSdk/targetSdk are 36 and the Robolectric tests use @Config(sdk = [36]).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Installs cmdline-tools and puts sdkmanager on PATH. The runner image ships an SDK
      # but not sdkmanager itself, so calling it directly fails with exit 127.
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --stacktrace

      # This is the check that would have caught the missing Kotlin Android plugin.
      # Without Kotlin compilation the build still "succeeds" but the APK has no app code.
      - name: Verify the APK contains the app's own classes
        run: .github/scripts/verify-app-classes.sh app/build/outputs/apk/debug/app-debug.apk

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      # Compiles the instrumented suite. It does not run it — that needs an emulator — but a
      # compile is what was missing: SplitCruiserAppUITest called ProposePickupDialog with two of
      # its seven parameters and asserted on button text that did not match, and the file sat
      # broken and invisible because no job ever built it.
      - name: Compile instrumented tests
        run: ./gradlew :app:assembleAndroidTest --stacktrace

      # Six real errors were outstanding when this was added, including a missing VIBRATE
      # permission that made every haptic call throw into a bare catch.
      - name: Android lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

  shared-common:
    name: Verify shared/commonMain is platform-agnostic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # JDK 21, not 17: Robolectric maps Android API 36 to a Java 21 requirement and throws
      # UnsupportedOperationException ("Android SDK 36 requires Java 21") on anything lower.
      # compileSdk/targetSdk are 36 and the Robolectric tests use @Config(sdk = [36]).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # Installs cmdline-tools and puts sdkmanager on PATH. The runner image ships an SDK
      # but not sdkmanager itself, so calling it directly fails with exit 127.
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      # Apple targets cannot be compiled on Linux, but compiling commonMain against the
      # *common* stdlib catches JVM-only APIs (System.currentTimeMillis, java.*, etc.)
      # before they reach a macOS runner. Cheapest possible iOS-breakage check.
      - name: Compile common metadata
        run: ./gradlew :shared:compileCommonMainKotlinMetadata --stacktrace

      # commonMain compiling says nothing about commonTest. Without this step the shared test
      # suite is dead weight: it was added in one PR and sat there for the whole of that PR
      # with two tests asserting things that were false, because no job ever ran it.
      - name: Shared unit tests
        run: ./gradlew :shared:testDebugUnitTest --stacktrace

      - name: Upload shared test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-test-report
          path: shared/build/reports/tests/
          if-no-files-found: ignore

  functions:
    name: Build & test Cloud Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install
        run: npm ci
        working-directory: functions

      # functions/ was built by nothing at all. `firebase.json` runs `tsc` as a predeploy step, so
      # a type error surfaced only at `firebase deploy` -- which is exactly how three functions
      # shipped bound to the `(default)` database while both apps read `databases/splitcruiser`.
      - name: Typecheck and build
        run: npm run build
        working-directory: functions

      - name: Unit tests
        run: npm test
        working-directory: functions

  firestore-rules:
    name: Execute firestore.rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: rules-tests/package-lock.json

      # The emulator is a Java process.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install
        run: npm ci
        working-directory: rules-tests

      # Until this job existed, firestore.rules had never been executed by anything -- no emulator
      # setup, no CI. Combined with a repository test suite that runs against a Ktor MockEngine
      # accepting every write, that is why four client writes the deployed rules reject shipped
      # without anyone noticing.
      - name: Run rules tests
        run: npm test
        working-directory: rules-tests

  workflows:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # CLAUDE.md asks for actionlint before pushing a workflow change, and the release skill's
      # log has three separate CI failures it would have caught in seconds: `secrets` in a job-level
      # `if:` producing a run with zero jobs, `${{ 1000 + github.run_number }}` (Actions expressions
      # have no arithmetic), and a shell-quoting error. An honour-system checklist item catches none
      # of them; this does.
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color
