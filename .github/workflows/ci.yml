name: CI

# Validation for pull requests and feature branches. Builds and tests only —
# no secrets, no signing, no publishing. The release workflows handle that.
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Build & test Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --stacktrace

      # This is the check that would have caught the missing Kotlin Android plugin.
      # Without Kotlin compilation the build still "succeeds" but the APK has no app code.
      - name: Verify the APK contains the app's own classes
        run: .github/scripts/verify-app-classes.sh app/build/outputs/apk/debug/app-debug.apk

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

  shared-common:
    name: Verify shared/commonMain is platform-agnostic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      # Apple targets cannot be compiled on Linux, but compiling commonMain against the
      # *common* stdlib catches JVM-only APIs (System.currentTimeMillis, java.*, etc.)
      # before they reach a macOS runner. Cheapest possible iOS-breakage check.
      - name: Compile common metadata
        run: ./gradlew :shared:compileCommonMainKotlinMetadata --stacktrace
